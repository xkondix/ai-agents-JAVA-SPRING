server:
  port: 8083

spring:
  application:
    name: langchain4j-mcp

langchain4j:
  ollama:
    chat-model:
      base-url: http://localhost:11434
      model-name: llama3.1:8b
      temperature: 0.3
      timeout: 120s
      log-requests: true
      log-responses: true

logging:
  level:
    com.xkondix: DEBUG
    dev.langchain4j: INFO
