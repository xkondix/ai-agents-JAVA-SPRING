server:
  port: 8090

spring:
  application:
    name: raw-agent

# ── Ollama (local model) ──────────────────────────────────────────────────
raw-agent:
  provider: ollama
  ollama:
    base-url: http://localhost:11434
    model: gemma3:4b
    temperature: 0.3
    timeout-seconds: 120

# ── OpenAI / OpenRouter (uncomment and set API key to use) ────────────────
#  provider: openai
#  openai:
#    base-url: https://openrouter.ai/api/v1
#    api-key: ${OPENAI_API_KEY}
#    model: anthropic/claude-sonnet-4-5
#    temperature: 0.3
#    timeout-seconds: 60

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.xkondix: DEBUG
