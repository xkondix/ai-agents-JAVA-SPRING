# ── Base (profile-independent) ────────────────────────────────────────────
server:
  port: 8090

spring:
  application:
    name: raw-agent
  profiles:
    # Runs with the "openrouter" profile unless another is explicitly activated:
    #   --spring.profiles.active=local   (Ollama on this machine)
    default: openrouter

# ── Observability ─────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
    metrics:
      export:
        url: http://localhost:4318/v1/metrics

logging:
  level:
    com.xkondix: DEBUG

---
# ── Profile: local — Ollama on this machine ───────────────────────────────
spring:
  config:
    activate:
      on-profile: local

raw-agent:
  provider: ollama
  ollama:
    base-url: http://localhost:11434
    model: llama3.1:8b
    temperature: 0.3
    timeout-seconds: 120

---
# ── Profile: openrouter — hosted models, OpenAI-compatible API ────────────
# API key comes ONLY from the OS environment variable OPENROUTER_API_KEY —
# never put the literal key in this file (public repo!).
# raw-agent appends /chat/completions itself, so base-url must include /v1.
spring:
  config:
    activate:
      on-profile: openrouter

raw-agent:
  provider: openai
  openai:
    base-url: https://openrouter.ai/api/v1
    api-key: ${OPENROUTER_API_KEY}
    model: openai/gpt-4o-mini   # vendor prefix required on OpenRouter
    temperature: 0.3
    timeout-seconds: 60
