# ── Base (profile-independent) ────────────────────────────────────────────
server:
  port: 8090

spring:
  application:
    name: raw-agent
  profiles:
    # Runs with the "openrouter" profile unless another is explicitly activated:
    #   --spring.profiles.active=local   (Ollama on this machine)
    default: openrouter

# ── Observability ─────────────────────────────────────────────────────────
# Three signals, one port. Boot 4 property layout:
#   traces  : management.opentelemetry.tracing.export.otlp.endpoint
#             (Boot 3 spelling was management.otlp.tracing.endpoint — DEAD)
#   logs    : management.opentelemetry.logging.export.otlp.endpoint
#   metrics : management.otlp.metrics.export.url  (Micrometer OtlpMeterRegistry,
#             not the OTel SDK — hence the deliberately different prefix)
#
# Logs additionally need the Logback->OTel bridge from `common`
# (logback-spring.xml + OtelLoggingBridgeAutoConfiguration) plus actuator on
# the classpath; without either, Loki stays empty and nothing is logged
# about it.
#
# The tracing symptom is especially confusing in THIS module, because it builds
# its spans BY HAND: trace and span ids still appear in every log line
# (Micrometer puts them in the MDC), the ids still nest correctly, metrics
# still reach Prometheus — and Tempo answers "failed to get trace with id ...:
# Not Found", because nothing was ever exported. Working instrumentation, no
# exporter.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics

logging:
  level:
    com.xkondix: DEBUG

---
# ── Profile: local — Ollama on this machine ───────────────────────────────
spring:
  config:
    activate:
      on-profile: local

raw-agent:
  provider: ollama
  ollama:
    base-url: http://localhost:11434
    model: llama3.1:8b
    temperature: 0.3
    timeout-seconds: 120

---
# ── Profile: openrouter — hosted models, OpenAI-compatible API ────────────
# API key comes ONLY from the OS environment variable OPENROUTER_API_KEY —
# never put the literal key in this file (public repo!).
# raw-agent appends /chat/completions itself, so base-url must include /v1.
spring:
  config:
    activate:
      on-profile: openrouter

raw-agent:
  provider: openai
  openai:
    base-url: https://openrouter.ai/api/v1
    api-key: ${OPENROUTER_API_KEY}
    model: openai/gpt-4o-mini   # vendor prefix required on OpenRouter
    temperature: 0.3
    timeout-seconds: 60
