# ─────────────────────────────────────────────────────────────────────────────
#  GRAFANA DATASOURCES — provisioned from the repo
#
#  WHY THIS FILE EXISTS. Datasource settings clicked together in the UI live in
#  Grafana's internal SQLite inside the container. They survive a restart and
#  are LOST on `docker compose down` / image change. The Trace-to-logs settings
#  below were reconstructed by hand twice already; the third time would have
#  been during a live demo.
#
#  MOUNTING THIS FILE REPLACES THE IMAGE'S OWN DATASOURCE PROVISIONING.
#  docker-compose mounts the whole directory over
#  /otel-lgtm/grafana/conf/provisioning/datasources, which hides the file that
#  grafana/otel-lgtm ships. That is why EVERY datasource has to be declared
#  here — dropping one does not fall back to a default, it simply disappears.
#
#  URLs are container-internal, not the host ports from docker-compose:
#    Grafana UI  3000 inside  -> 3100 published
#    Tempo       3200 inside  -> 3201 published
#    Loki        3100 inside  (not published)
#    Prometheus  9090 inside  -> 9090 published
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: 1

# Remove the image's pre-existing entries first. Provisioning matches by name,
# and an existing datasource with the same name but a different uid makes the
# update fail — quietly, leaving the old settings in place.
deleteDatasources:
  - name: Prometheus
  - name: Tempo
  - name: Loki
  - name: Pyroscope

datasources:

  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://localhost:9090
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      # ── THE PUSH INTERVAL, DECLARED TO GRAFANA ──────────────────────────
      # Nothing scrapes these applications: Micrometer's OtlpMeterRegistry
      # PUSHES every 60 s (management.otlp.metrics.export.step default, logged
      # at startup as "Publishing metrics ... every 1m"). Grafana does not
      # know that; it assumes the Prometheus default of 15 s and derives
      # $__rate_interval = 4 x 15 s = 60 s. A 60 s window over samples that
      # are 60 s apart holds two points only by luck, so rate() and increase()
      # return nothing most of the time and a module that clearly ran looks
      # like it emitted no metrics at all — while its JVM gauges (no rate()
      # involved) show up fine on the same dashboard.
      #
      # timeInterval is Grafana's "scrape interval" for this datasource. With
      # 60 s here, $__rate_interval becomes 4 m and every rate window contains
      # at least four pushes. If the step in application.yml ever changes,
      # change this with it.
      timeInterval: 60s

  # ── Tempo ────────────────────────────────────────────────────────────────
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://localhost:3200
    editable: true
    jsonData:
      # ── Trace -> logs. This is the block that kept disappearing. ─────────
      tracesToLogsV2:
        datasourceUid: loki

        # NOT ZERO, ON PURPOSE. With 0/0 Grafana builds a time range exactly as
        # wide as the clicked span. The mcp-server span lasts ~4 ms, so the
        # query window was 4 ms and "Logs for this span" returned one line or
        # none at all — which reads like a broken bridge and is not one.
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'

        # No tags. `service.name as service_name` looks harmless but it scopes
        # the query to the service of the CLICKED span, so a trace spanning
        # spring-ai-agent-mcp and mcp-server only ever showed half its logs.
        tags: []

        # Both filters off: the custom query below already narrows by trace_id,
        # and filtering by span id would hide everything logged in sibling spans.
        filterByTraceID: false
        filterBySpanID: false

        customQuery: true
        # trace_id arrives as OTLP structured metadata, not a label, so it
        # cannot go in the stream selector — hence the `|` filter. The selector
        # matches any service so both sides of a distributed trace come back.
        query: '{service_name=~".+"} | trace_id = "$${__trace.traceId}"'

      # Trace -> metrics keeps a small window: these are rate queries, not an
      # id lookup, so a wide range would flatten whatever spike you clicked on.
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: '-2m'
        spanEndTimeShift: '2m'
        tags: []

      # Service graph and RED metrics are generated by Tempo's metrics
      # generator and stored in Prometheus. They only appear for spans with
      # kind=SERVER — the reason claude-mcp-server switched from
      # tracer.nextSpan() (INTERNAL) to spanBuilder().kind(SERVER).
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true

  # ── Loki ─────────────────────────────────────────────────────────────────
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://localhost:3100
    editable: true
    jsonData:
      maxLines: 1000
      # The opposite direction: log -> trace. Turns the trace_id on every log
      # line into a link into Tempo. Works because the OTel Logback appender
      # (common/logback-spring.xml + OtelLoggingBridgeAutoConfiguration) puts
      # trace_id into structured metadata, so Grafana sees it as a field.
      derivedFields:
        - name: trace_id
          matcherType: label
          matcherRegex: trace_id
          url: '$${__value.raw}'
          urlDisplayLabel: 'Trace: $${__value.raw}'
          datasourceUid: tempo

  # Shipped by the image and unused by this project, but declared so the
  # mount does not silently remove it.
  - name: Pyroscope
    uid: pyroscope
    type: grafana-pyroscope-datasource
    access: proxy
    url: http://localhost:4040
    editable: true
