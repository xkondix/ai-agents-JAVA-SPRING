# ── Base (profile-independent) ────────────────────────────────────────────
server:
  port: 8083

spring:
  application:
    name: langchain4j-agent-mcp
  profiles:
    default: openrouter   # switch back to Ollama with --spring.profiles.active=local

lc4j:
  mcp:
    # Off by default: a tool call produces two traces (agent + mcp-server), the
    # contrast with spring-ai-agent-mcp. true = traceparent on every POST /mcp,
    # one trace with Services: 2. See McpClientConfig.
    #
    # Keep it false until the propagation part of the talk ("Why two traces?"
    # needs two), then restart with --lc4j.mcp.trace-propagation.enabled=true.
    # The pre-demo checklist in OBSERVABILITY.md §5 has the same step.
    trace-propagation:
      enabled: false

# ── Prompt / completion content on LangChain4j spans ─────────────────────
# LC4j counterpart of spring.ai.chat.observations.log-prompt/log-completion.
# Spring AI writes the content to LOG lines (Loki), this listener puts it on
# the "chat <model>" SPAN as gen_ai.prompt / gen_ai.completion (Tempo).
xkondix:
  observability:
    genai:
      include-prompt: true
      include-completion: true
      max-content-length: 4000

# ── Observability ─────────────────────────────────────────────────────────
# Three signals to localhost:4318; property layout, the Logback->OTel bridge
# and every silent failure found so far are documented in OBSERVABILITY.md.
#
# Worth knowing what this module is SUPPOSED to look like in Tempo: with
# lc4j.mcp.trace-propagation.enabled=false (above) the agent and mcp-server
# traces are separate — the contrast with spring-ai-agent-mcp, which sends
# traceparent from the start. "Two traces instead of one" is the intended
# result here, not a regression. (Confirmed 2026-09-02: agent trace 9db85c1a…,
# mcp-server logged the same call under 472b0fe2….) With the switch on, the
# same call is one trace with Services: 2.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics

logging:
  level:
    com.xkondix: DEBUG
    dev.langchain4j: INFO

---
# ── Profile: local — Ollama on this machine ───────────────────────────────
spring:
  config:
    activate:
      on-profile: local

langchain4j:
  ollama:
    chat-model:
      base-url: http://localhost:11434
      model-name: llama3.1:8b
      temperature: 0.3
      timeout: 120s
      log-requests: true
      log-responses: true

---
# ── Profile: openrouter — hosted models, OpenAI-compatible API ────────────
# API key ONLY from the OS env var OPENROUTER_API_KEY (public repo!).
# Model: OPENROUTER_MODEL env var with a default — one switch for all seven
# agents when OpenRouter latency spikes on the day (see raw-agent yml).
spring:
  config:
    activate:
      on-profile: openrouter

langchain4j:
  open-ai:
    chat-model:
      base-url: https://openrouter.ai/api/v1
      api-key: ${OPENROUTER_API_KEY}
      model-name: ${OPENROUTER_MODEL:openai/gpt-4o-mini}   # vendor prefix required on OpenRouter
      temperature: 0.3
      log-requests: true    # LC4j masks the Authorization header in logs
      log-responses: true
