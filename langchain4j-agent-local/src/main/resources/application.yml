# ── Base (profile-independent) ────────────────────────────────────────────
server:
  port: 8082

spring:
  application:
    name: langchain4j-agent-local
  profiles:
    default: openrouter   # switch back to Ollama with --spring.profiles.active=local

# ── Prompt / completion content on LangChain4j spans ─────────────────────
# LC4j counterpart of spring.ai.chat.observations.log-prompt/log-completion.
# Spring AI writes the content to LOG lines (Loki), this listener puts it on
# the "chat <model>" SPAN as gen_ai.prompt / gen_ai.completion (Tempo).
# Off by default in `common`; on here so both frameworks are comparable.
xkondix:
  observability:
    genai:
      include-prompt: true
      include-completion: true
      max-content-length: 4000

# ── Observability ─────────────────────────────────────────────────────────
# Three signals to localhost:4318; property layout, the Logback->OTel bridge
# and every silent failure found so far are documented in OBSERVABILITY.md.
# Getting the tracing endpoint wrong here loses more than the LLM spans: it
# also loses the tool_call spans that TracingToolProvider adds.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics

logging:
  level:
    com.xkondix: DEBUG
    dev.langchain4j: INFO

---
# ── Profile: local — Ollama on this machine ───────────────────────────────
# LC4j starters are property-driven: only the model whose properties exist
# in the active profile gets auto-configured, so ollama/open-ai never clash.
spring:
  config:
    activate:
      on-profile: local

langchain4j:
  ollama:
    chat-model:
      base-url: http://localhost:11434
      # llama3.1 (not gemma3): local tools require function calling,
      # which gemma3 does not support.
      model-name: llama3.1:8b
      temperature: 0.3
      timeout: 120s
      log-requests: true
      log-responses: true

---
# ── Profile: openrouter — hosted models, OpenAI-compatible API ────────────
# API key ONLY from the OS env var OPENROUTER_API_KEY (public repo!).
# LangChain4j needs the /v1 suffix in base-url — as do the Spring AI modules
# since 2.0, so all seven modules agree on this URL.
# Model: OPENROUTER_MODEL env var with a default — one switch for all seven
# agents when OpenRouter latency spikes on the day (see raw-agent yml).
spring:
  config:
    activate:
      on-profile: openrouter

langchain4j:
  open-ai:
    chat-model:
      base-url: https://openrouter.ai/api/v1
      api-key: ${OPENROUTER_API_KEY}
      model-name: ${OPENROUTER_MODEL:openai/gpt-4o-mini}   # vendor prefix required on OpenRouter
      temperature: 0.3
      log-requests: true    # LC4j masks the Authorization header in logs
      log-responses: true
