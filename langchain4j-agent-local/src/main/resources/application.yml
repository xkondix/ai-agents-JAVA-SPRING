server:
  port: 8082

spring:
  application:
    name: langchain4j-agent-local
  data:
    redis:
      host: localhost
      port: 6379

langchain4j:
  ollama:
    chat-model:
      base-url: http://localhost:11434
      model-name: gemma3:4b
      temperature: 0.3
      timeout: 120s
      log-requests: true
      log-responses: true
  # Uncomment to use OpenAI / OpenRouter instead:
  # open-ai:
  #   chat-model:
  #     api-key: ${OPENAI_API_KEY}
  #     base-url: https://openrouter.ai/api/v1
  #     model-name: anthropic/claude-sonnet-4-5
  #     temperature: 0.3

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.xkondix: DEBUG
    dev.langchain4j: INFO
