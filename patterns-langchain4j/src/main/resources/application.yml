# ── Base (profile-independent) ────────────────────────────────────────────
server:
  port: 8087

spring:
  application:
    name: patterns-langchain4j
  profiles:
    default: openrouter   # switch back to Ollama with --spring.profiles.active=local
  # Virtual threads (Java 21): getSecretRumors blocks its request thread
  # until a human approves it — with a platform-thread pool a few pending
  # approvals would exhaust Tomcat.
  threads:
    virtual:
      enabled: true

# Human-in-the-loop gate (common/approval)
xkondix:
  approval:
    timeout-minutes: 10
  # ── Prompt / completion content on LangChain4j spans ──────────────────────
  # The LC4j counterpart of spring.ai.chat.observations.log-prompt /
  # log-completion — with one deliberate difference in WHERE the content
  # lands: Spring AI writes it to LOG lines (Loki, correlated by trace id),
  # this listener puts it on the "chat <model>" SPAN as gen_ai.prompt /
  # gen_ai.completion (Tempo). Same conversation, two signals — the contrast
  # is part of the talk. Off by default in `common`; on here because the
  # patterns are about what each step SAYS to the model.
  observability:
    genai:
      include-prompt: true
      include-completion: true
      max-content-length: 4000

# ── Observability ─────────────────────────────────────────────────────────
# Three signals, one port. Boot 4 property layout:
#   traces  : management.opentelemetry.tracing.export.otlp.endpoint
#             (Boot 3 spelling was management.otlp.tracing.endpoint — DEAD)
#   logs    : management.opentelemetry.logging.export.otlp.endpoint
#   metrics : management.otlp.metrics.export.url  (Micrometer OtlpMeterRegistry,
#             not the OTel SDK — hence the deliberately different prefix)
#
# Logs additionally need the Logback->OTel bridge from `common`
# (logback-spring.xml + OtelLoggingBridgeAutoConfiguration). Miss it and Loki
# stays empty with no error anywhere.
#
# An empty Tempo hurts most in THIS module: the whole point of the patterns is
# their TRACE SHAPE — a staircase for chaining, overlapping spans for
# parallelization, a loop for evaluator-optimizer. No export, no shape,
# nothing to show.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics

logging:
  level:
    com.xkondix: DEBUG
    dev.langchain4j: INFO

---
spring:
  config:
    activate:
      on-profile: local

langchain4j:
  ollama:
    chat-model:
      base-url: http://localhost:11434
      model-name: llama3.1:8b
      temperature: 0.3
      timeout: 120s
      log-requests: true
      log-responses: true

---
# API key ONLY from the OS env var OPENROUTER_API_KEY (public repo!).
# LangChain4j needs the /v1 suffix in base-url. Since Spring AI 2.0 moved to
# the official OpenAI SDK and dropped completions-path, the Spring AI modules
# now need it too — so all seven modules finally agree on this URL.
spring:
  config:
    activate:
      on-profile: openrouter

langchain4j:
  open-ai:
    chat-model:
      base-url: https://openrouter.ai/api/v1
      api-key: ${OPENROUTER_API_KEY}
      model-name: openai/gpt-4o-mini
      temperature: 0.3
      log-requests: true
      log-responses: true
