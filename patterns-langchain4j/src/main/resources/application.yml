# ── Base (profile-independent) ────────────────────────────────────────────
server:
  port: 8087

spring:
  application:
    name: patterns-langchain4j
  profiles:
    default: openrouter   # switch back to Ollama with --spring.profiles.active=local
  # Virtual threads (Java 21): getSecretRumors blocks its request thread
  # until a human approves it — with a platform-thread pool a few pending
  # approvals would exhaust Tomcat.
  threads:
    virtual:
      enabled: true

# Human-in-the-loop gate (common/approval)
xkondix:
  approval:
    timeout-minutes: 10
  # Prompt / completion content on LangChain4j spans — the LC4j counterpart of
  # spring.ai.chat.observations.log-prompt/log-completion. Spring AI writes it
  # to LOG lines (Loki), this listener puts it on the SPAN (Tempo).
  observability:
    genai:
      include-prompt: true
      include-completion: true
      max-content-length: 4000

# ── Observability ─────────────────────────────────────────────────────────
# Three signals to localhost:4318; property layout, the Logback->OTel bridge
# and every silent failure found so far are documented in OBSERVABILITY.md.
# An empty Tempo hurts most in THIS module: the whole point of the patterns is
# their TRACE SHAPE — a staircase for chaining, overlapping spans for
# parallelization, a loop for evaluator-optimizer.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics

logging:
  level:
    com.xkondix: DEBUG
    dev.langchain4j: INFO

---
spring:
  config:
    activate:
      on-profile: local

langchain4j:
  ollama:
    chat-model:
      base-url: http://localhost:11434
      model-name: llama3.1:8b
      temperature: 0.3
      timeout: 120s
      log-requests: true
      log-responses: true

---
# API key ONLY from the OS env var OPENROUTER_API_KEY (public repo!).
# Model: OPENROUTER_MODEL env var with a default — one switch for all seven
# agents when OpenRouter latency spikes on the day (see raw-agent yml).
spring:
  config:
    activate:
      on-profile: openrouter

langchain4j:
  open-ai:
    chat-model:
      base-url: https://openrouter.ai/api/v1
      api-key: ${OPENROUTER_API_KEY}
      model-name: ${OPENROUTER_MODEL:openai/gpt-4o-mini}
      temperature: 0.3
      log-requests: true
      log-responses: true
