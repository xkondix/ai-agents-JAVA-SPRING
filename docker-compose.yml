services:

  # ─────────────────────────────────────────────────────────────────────────
  # ONE PROFILE, THREE CONTAINERS: everything here is actually used.
  #
  #   docker compose up -d     -> lgtm + redis + ollama
  #
  # There used to be an `extras` profile holding Chroma, Jira and Postgres,
  # "reserved" for RAG and integration demos that were never built. Two years
  # of reserved services is a maintenance surface, not a plan: pinned versions
  # that rot, a Jira boot measured in minutes and gigabytes, and a compose file
  # nobody can read at a glance. They are gone; `git log` remembers them if a
  # later part of the series needs one back.
  #
  # REDIS MOVED OUT OF THAT PROFILE AND INTO THE DEFAULT, because it is no
  # longer reserved — multimodal-lab stores chat memory and the gallery index
  # in it. While it sat behind `--profile extras`, a plain `docker compose up`
  # left it down and the module logged "Unable to connect to Redis" on every
  # request, which reads like a broken container rather than one that was
  # never started.
  # ─────────────────────────────────────────────────────────────────────────

  # Local LLM server (used by the `local` Spring profile only)
  ollama:
    image: ollama/ollama
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

  # Chat memory + artifact gallery index for multimodal-lab (port 8089).
  #
  # On Windows, reach it as 127.0.0.1 rather than localhost: `localhost`
  # resolves to ::1 first and Docker Desktop publishes on IPv4 only, so a
  # healthy container still answers "Unable to connect to Redis". The same
  # resolution order is visible in the OTLP exporter's own error message.
  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  # Observability stack — Grafana LGTM (Presentation 3)
  # Loki (logs) + Grafana (dashboards) + Tempo (traces) + Prometheus (metrics)
  grafana-lgtm:
    # PINNED, NOT :latest. The provisioning mounts below REPLACE what the image
    # ships, so a silent `latest` bump (new Grafana major, moved provisioning
    # paths, changed datasource schema) can make dashboards or datasources
    # vanish with no error — the worst possible moment for that is on stage.
    # 0.32.0 is the release current on 2026-09-02 (github.com/grafana/docker-otel-lgtm/releases).
    # Bump deliberately, then re-check the dashboard and the Tempo->Loki jump.
    image: grafana/otel-lgtm:0.32.0
    container_name: lgtm
    ports:
      - "3100:3000"   # Grafana UI     → http://localhost:3100 (admin/admin)
      - "4317:4317"   # OTLP gRPC      → OpenTelemetry collector
      - "4318:4318"   # OTLP HTTP      → OpenTelemetry collector
      - "9090:9090"   # Prometheus     → http://localhost:9090
      - "3201:3200"   # Tempo          → http://localhost:3201
      - "4040:4040"   # Pyroscope      → profiling
    environment:
      # Open Grafana straight on the project dashboard — one click less on
      # stage, and the "Demo readiness" row is the first thing on screen.
      # The path is the provisioned JSON inside the container (README,
      # "Add custom dashboards").
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /otel-lgtm/grafana/conf/provisioning/dashboards/ai-agents-observability.json
      # Keep a week of metrics so rehearsal runs stay comparable with the
      # real thing (README, "Customize backend configuration").
      PROMETHEUS_EXTRA_ARGS: "--storage.tsdb.retention.time=7d"
    volumes:
      # Provisioned dashboards — dashboards clicked together in the UI live
      # only in the container's SQLite and vanish on recreate; anything
      # exported as JSON into ./grafana/provisioning/dashboards survives
      # and ships with the repo.
      - ./grafana/provisioning/dashboards:/otel-lgtm/grafana/conf/provisioning/dashboards

      # Provisioned datasources — same reasoning, learned the hard way.
      # The Trace-to-logs settings on the Tempo datasource (time shifts, no
      # service.name tag, custom trace_id query) were rebuilt by hand twice
      # after the container was recreated.
      #
      # NOTE: this mount REPLACES the datasource provisioning that
      # grafana/otel-lgtm ships, so datasources.yml must declare ALL of them —
      # Prometheus, Tempo, Loki and Pyroscope. A missing entry does not fall
      # back to the image default; the datasource simply disappears.
      - ./grafana/provisioning/datasources:/otel-lgtm/grafana/conf/provisioning/datasources

      # DATA SURVIVES A RECREATE. Every backend in the image writes under
      # /data (README, "Persist data across container instantiation"), so a
      # single named volume keeps Prometheus series, Tempo traces, Loki logs
      # and Grafana's own SQLite across `docker compose up --force-recreate`.
      # Before this line existed, every recreate — including the one needed
      # to apply a datasource change — wiped the whole rehearsal history.
      # To start clean on purpose: docker compose down -v.
      - lgtm-data:/data
    restart: unless-stopped

volumes:
  ollama:
  lgtm-data:
