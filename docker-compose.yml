version: '3.8'
services:
  ollama:
    image: ollama/ollama
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  chroma:
    image: ghcr.io/chroma-core/chroma:0.6.4.dev226
    container_name: chroma
    ports:
      - "8000:8000"

  jira-db:
    image: postgres:15
    container_name: jira-db
    environment:
      POSTGRES_DB: jira
      POSTGRES_USER: jira
      POSTGRES_PASSWORD: jira
    volumes:
      - jira-db-data:/var/lib/postgresql/data
    restart: unless-stopped

  jira:
    image: atlassian/jira-software:latest
    container_name: jira
    ports:
      - "8080:8080"
    environment:
      ATL_JDBC_URL: jdbc:postgresql://jira-db:5432/jira
      ATL_JDBC_USER: jira
      ATL_JDBC_PASSWORD: jira
      ATL_DB_DRIVER: org.postgresql.Driver
    volumes:
      - jira-data:/var/atlassian/application-data/jira
    depends_on:
      - jira-db
    restart: unless-stopped

volumes:
  ollama:
  jira-data:
  jira-db-data: