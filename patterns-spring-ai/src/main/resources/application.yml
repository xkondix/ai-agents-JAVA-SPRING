# ── Base (profile-independent) ────────────────────────────────────────────
server:
  port: 8088

spring:
  application:
    name: patterns-spring-ai
  profiles:
    default: openrouter   # switch back to Ollama with --spring.profiles.active=local
  # Virtual threads (Java 21): getSecretRumors blocks its request thread
  # until a human approves it — with a platform-thread pool a few pending
  # approvals would exhaust Tomcat.
  threads:
    virtual:
      enabled: true
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
  ai:
    chat:
      observations:
        include-prompt: true
        include-completion: true

# Human-in-the-loop gate (common/approval)
xkondix:
  approval:
    timeout-minutes: 10

# ── Observability ─────────────────────────────────────────────────────────
# Three signals, one port. Boot 4 property layout:
#   traces  : management.opentelemetry.tracing.export.otlp.endpoint
#             (Boot 3 spelling was management.otlp.tracing.endpoint — DEAD)
#   logs    : management.opentelemetry.logging.export.otlp.endpoint
#   metrics : management.otlp.metrics.export.url  (Micrometer OtlpMeterRegistry,
#             not the OTel SDK — hence the deliberately different prefix)
#
# Logs additionally need the Logback->OTel bridge from `common`
# (logback-spring.xml + OtelLoggingBridgeAutoConfiguration) plus actuator on
# the classpath. Miss either and Loki stays empty with no error anywhere.
#
# An empty Tempo hurts most in THIS module: the whole point of the patterns is
# their TRACE SHAPE — a staircase for chaining, overlapping spans for
# parallelization, a loop for evaluator-optimizer. No export, no shape,
# nothing to show.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics

logging:
  level:
    com.xkondix: DEBUG
    org.springframework.ai: INFO

---
spring:
  config:
    activate:
      on-profile: local
  ai:
    model:
      chat: ollama
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.1:8b
          temperature: 0.3

---
# API key ONLY from the OS env var OPENROUTER_API_KEY (public repo!).
spring:
  config:
    activate:
      on-profile: openrouter
  ai:
    model:
      chat: openai
    openai:
      # SPRING AI 2.0 REWROTE THE OPENAI MODEL ON TOP OF THE OFFICIAL
      # OpenAI Java SDK (com.openai:openai-java-core), replacing the previous
      # RestClient-based implementation. That changes how the URL is built:
      #
      #   Spring AI 1.x : base-url + completions-path
      #                   https://openrouter.ai/api  +  /v1/chat/completions
      #   Spring AI 2.0 : base-url handed to the SDK, which appends
      #                   /chat/completions itself
      #
      # completions-path no longer exists as a property, so the /v1 segment
      # has to live in base-url. With the old value the request went to
      # https://openrouter.ai/api/chat/completions and OpenRouter answered
      # 404 — surfacing as com.openai.errors.NotFoundException: 404: Unknown,
      # a message that says nothing about the URL being wrong.
      base-url: https://openrouter.ai/api/v1
      api-key: ${OPENROUTER_API_KEY}
      chat:
        options:
          # The .options infix SURVIVED for chat in 2.0 (OpenAiChatProperties
          # still nests an Options object under spring.ai.openai.chat).
          # It was flattened only for embedding, image, audio, moderation
          # and OCR — do not "fix" those by analogy with this block.
          model: openai/gpt-4o-mini
          temperature: 0.3
