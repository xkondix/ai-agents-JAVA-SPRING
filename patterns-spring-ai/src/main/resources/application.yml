# ── Base (profile-independent) ────────────────────────────────────────────
server:
  port: 8088

spring:
  application:
    name: patterns-spring-ai
  profiles:
    default: openrouter   # switch back to Ollama with --spring.profiles.active=local
  # Virtual threads (Java 21): getSecretRumors blocks its request thread
  # until a human approves it — with a platform-thread pool a few pending
  # approvals would exhaust Tomcat.
  threads:
    virtual:
      enabled: true
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
  ai:
    chat:
      observations:
        # RENAMED IN SPRING AI 1.0.0-M8: include-prompt/include-completion ->
        # log-prompt/log-completion; content goes to LOG lines, not spans.
        # See OBSERVABILITY.md §3 #5.
        log-prompt: true
        log-completion: true

# Human-in-the-loop gate (common/approval)
xkondix:
  approval:
    timeout-minutes: 10

# ── Observability ─────────────────────────────────────────────────────────
# Three signals to localhost:4318; property layout, the Logback->OTel bridge
# and every silent failure found so far are documented in OBSERVABILITY.md.
# An empty Tempo hurts most in THIS module: the whole point of the patterns is
# their TRACE SHAPE — a staircase for chaining, overlapping spans for
# parallelization, a loop for evaluator-optimizer.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics

logging:
  level:
    com.xkondix: DEBUG
    org.springframework.ai: INFO

---
spring:
  config:
    activate:
      on-profile: local
  ai:
    model:
      chat: ollama
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.1:8b
          temperature: 0.3

---
# API key ONLY from the OS env var OPENROUTER_API_KEY (public repo!).
# BASE-URL INCLUDES /v1 — CHANGED IN SPRING AI 2.0 (official OpenAI SDK appends
# /chat/completions itself; completions-path no longer exists). With the old
# value OpenRouter answered 404 as com.openai.errors.NotFoundException.
# Model: OPENROUTER_MODEL env var with a default — one switch for all seven
# agents when OpenRouter latency spikes on the day (see raw-agent yml).
spring:
  config:
    activate:
      on-profile: openrouter
  ai:
    model:
      chat: openai
    openai:
      base-url: https://openrouter.ai/api/v1
      api-key: ${OPENROUTER_API_KEY}
      chat:
        options:
          # The .options infix SURVIVED for chat in 2.0 (OpenAiChatProperties
          # still nests an Options object under spring.ai.openai.chat).
          model: ${OPENROUTER_MODEL:openai/gpt-4o-mini}
          temperature: 0.3
