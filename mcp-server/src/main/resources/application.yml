server:
  port: 8081

spring:
  application:
    name: mcp-server
  ai:
    mcp:
      server:
        name: ai-sandbox-mcp-server
        version: 1.0.0
        # SYNC_HTTP_SSE — HTTP transport for LangChain4j and Spring AI MCP clients
        transport: SYNC_HTTP_SSE
  jackson:
    serialization:
      write-dates-as-timestamps: false
  # Virtual Threads (Java 21) — each request gets its own virtual thread.
  # Lets requestApproval() block on future.get() without exhausting the Tomcat
  # thread pool, so approve/reject REST calls are handled concurrently while a
  # tool call is waiting for approval.
  threads:
    virtual:
      enabled: true

# ── Observability ─────────────────────────────────────────────────────────
# Tracing ENABLED — without it, MCP tool executions on this server produce
# no spans at all, so agent traces in Tempo end at the HTTP client call.
# If Grafana LGTM is down you will see "connection refused :4318" warnings;
# either start it (docker compose up lgtm -d) or set tracing.enabled: false.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
    metrics:
      export:
        url: http://localhost:4318/v1/metrics

logging:
  level:
    com.xkondix: DEBUG
    io.modelcontextprotocol: INFO
