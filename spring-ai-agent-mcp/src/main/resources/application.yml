server:
  port: 8085

spring:
  application:
    name: spring-ai-agent-mcp
  main:
    allow-bean-definition-overriding: true
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.1:8b
          temperature: 0.3
    # Spring AI 1.1+ — GenAI Semantic Conventions (OTel)
    chat:
      observations:
        include-prompt: true
        include-completion: true
    mcp:
      client:
        enabled: true
        type: SYNC
        # FIX: connections must live under a TRANSPORT key (sse / streamable-http).
        # The previous `client.connections` prefix does not exist, so Spring Boot
        # silently ignored it -> ZERO MCP clients -> zero tools for the model.
        sse:
          connections:
            java-mcp-server:
              url: http://localhost:8081   # base URL only; /sse endpoint is the default
            # code-mcp-server runs in STDIO mode by default (Claude Desktop).
            # Enable this ONLY when it runs with transport=SYNC_HTTP_SSE,
            # otherwise the failed connection breaks application startup:
            # code-mcp-server:
            #   url: http://localhost:8086

# ── Observability ─────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
    metrics:
      export:
        url: http://localhost:4318/v1/metrics

logging:
  level:
    com.xkondix: DEBUG
    com.xkondix.springai.mcp.config: TRACE   # shows "Injected trace context..." per MCP request
    org.springframework.ai: INFO
