# ── Base (profile-independent) ────────────────────────────────────────────
server:
  port: 8085

spring:
  application:
    name: spring-ai-agent-mcp
  profiles:
    default: openrouter   # switch back to Ollama with --spring.profiles.active=local
  # spring.main.allow-bean-definition-overriding is DELIBERATELY NOT SET.
  # It used to be true, and it is the exact mechanism that once hid a broken
  # tool registration: our "mcpToolCallbacks" bean was silently replaced by
  # the auto-configured one and the model received zero tools (see
  # McpClientConfig). With the flag off, a name collision fails the context
  # loudly at startup — which is the behaviour a demo project wants.
  autoconfigure:
    # Chat provider is selected per profile via spring.ai.model.chat.
    # Only the non-chat OpenAI autoconfigurations stay excluded permanently.
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
  ai:
    chat:
      observations:
        # RENAMED IN SPRING AI 1.0.0-M8: include-prompt/include-completion ->
        # log-prompt/log-completion, and the content now goes to LOG lines
        # (correlated by trace id), not to span attributes. The old keys bound
        # to nothing. See spring-ai-agent-local/application.yml for the full
        # note and the source links.
        log-prompt: true
        log-completion: true
    mcp:
      client:
        enabled: true
        type: SYNC
        # ── TRANSPORT: STREAMABLE HTTP ────────────────────────────────────
        # Connections live under a TRANSPORT key, and that key must match the
        # server. mcp-server (8081) now runs protocol: STREAMABLE, so this
        # moved from `sse:` to `streamable-http:`.
        #
        # Shape verified in McpStreamableHttpClientProperties:
        #   prefix  spring.ai.mcp.client.streamable-http
        #   record ConnectionParameters(String url, String endpoint)
        # `url` is the base URL only; `endpoint` defaults to /mcp and is
        # written out here so the pairing with the server side is visible.
        #
        # A MISMATCH IS FATAL, NOT DEGRADED. McpClientAutoConfiguration calls
        # McpSyncClient.initialize() while building the bean, so a wrong
        # transport does not mean "agent without tools" — it means the context
        # never starts. Two different failure modes seen while migrating:
        #   server down      -> ConnectException, fails fast
        #   wrong transport  -> the handshake hangs and dies after 20 s with
        #                       "Did not observe any item or terminal signal"
        # The second one reads like a network problem and is not.
        #
        # STARTUP ORDER: mcp-server must be running BEFORE this module.
        streamable-http:
          connections:
            java-mcp-server:
              url: http://localhost:8081
              endpoint: /mcp
        # claude-mcp-server runs in STDIO mode, dedicated to Claude Desktop,
        # so it is not reachable over HTTP and is not listed here.

# ── Observability ─────────────────────────────────────────────────────────
# SPRING BOOT 4 MOVED THE EXPORT PROPERTIES. All three signals, one port:
#   traces  : management.opentelemetry.tracing.export.otlp.endpoint
#             (Boot 3 spelling was management.otlp.tracing.endpoint — DEAD)
#   logs    : management.opentelemetry.logging.export.otlp.endpoint
#   metrics : management.otlp.metrics.export.url  (unchanged — that one belongs
#             to the Micrometer OtlpMeterRegistry, not the OTel SDK, hence the
#             deliberately different prefix)
#
# The LOGS line needs two things that Boot does NOT give you:
#   1. the Logback appender + install() call — both live in `common`
#      (logback-spring.xml + OtelLoggingBridgeAutoConfiguration)
#   2. this endpoint
# Miss either and Loki stays empty with no error anywhere.
# (Boot 4.0.0 additionally required actuator on the classpath for log export;
# that was fixed in 4.0.1. Actuator is still here for its endpoints.)
#
# This module is where the agent and mcp-server traces are joined into ONE
# distributed trace, so getting the tracing endpoint wrong hurts most here:
# spans would still be created and correlated in-process but never exported,
# and the propagation demo would look broken while the code is fine.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics

logging:
  level:
    com.xkondix: DEBUG
    com.xkondix.springai.mcp.config: TRACE   # "Injected trace context..." per MCP request
    org.springframework.ai: INFO

---
# ── Profile: local — Ollama on this machine ───────────────────────────────
spring:
  config:
    activate:
      on-profile: local
  ai:
    model:
      chat: ollama   # activates only the Ollama chat autoconfiguration
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.1:8b
          temperature: 0.3

---
# ── Profile: openrouter — hosted models, OpenAI-compatible API ────────────
# API key ONLY from the OS env var OPENROUTER_API_KEY (public repo!).
#
# BASE-URL NOW INCLUDES /v1 — CHANGED IN SPRING AI 2.0.
# The OpenAI model was rewritten on top of the official OpenAI Java SDK
# (com.openai:openai-java-core), replacing the RestClient implementation:
#
#   Spring AI 1.x : base-url + completions-path
#                   https://openrouter.ai/api  +  /v1/chat/completions
#   Spring AI 2.0 : base-url handed to the SDK, which appends
#                   /chat/completions itself
#
# completions-path no longer exists as a property, so /v1 belongs in base-url.
# This module now matches LangChain4j and raw-agent instead of differing from
# them — the old comment claiming otherwise was true for 1.x only.
spring:
  config:
    activate:
      on-profile: openrouter
  ai:
    model:
      chat: openai   # activates only the OpenAI chat autoconfiguration
    openai:
      base-url: https://openrouter.ai/api/v1
      api-key: ${OPENROUTER_API_KEY}
      chat:
        options:
          # The .options infix SURVIVED for chat in 2.0 (OpenAiChatProperties
          # still nests an Options object under spring.ai.openai.chat).
          # It was flattened only for embedding, image, audio, moderation
          # and OCR — do not "fix" those by analogy with this block.
          model: openai/gpt-4o-mini   # vendor prefix required on OpenRouter
          temperature: 0.3
