# ── Base (profile-independent) ────────────────────────────────────────────
server:
  port: 8084

spring:
  application:
    name: spring-ai-agent-local
  profiles:
    default: openrouter   # switch back to Ollama with --spring.profiles.active=local
  autoconfigure:
    # Chat provider is selected per profile via spring.ai.model.chat.
    # Only the non-chat OpenAI autoconfigurations stay excluded permanently —
    # we never use embeddings/audio/image/moderation in this module.
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
  ai:
    chat:
      observations:
        # RENAMED IN SPRING AI 1.0.0-M8: include-prompt/include-completion ->
        # log-prompt/log-completion, and the content goes to LOG lines
        # (Loki, trace-correlated), not to span attributes. The old keys bound
        # to nothing — see OBSERVABILITY.md §3 #5. The LangChain4j listener
        # puts the same content on the SPAN instead: same data, two signals.
        log-prompt: true
        log-completion: true

# ── Observability ─────────────────────────────────────────────────────────
# Three signals to localhost:4318; property layout, the Logback->OTel bridge
# and every silent failure found so far are documented in OBSERVABILITY.md.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics

logging:
  level:
    com.xkondix: DEBUG
    org.springframework.ai: INFO

---
# ── Profile: local — Ollama on this machine ───────────────────────────────
spring:
  config:
    activate:
      on-profile: local
  ai:
    model:
      chat: ollama   # activates only the Ollama chat autoconfiguration
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          # llama3.1 (not gemma3): local tools require function calling,
          # which gemma3 does not support.
          model: llama3.1:8b
          temperature: 0.3

---
# ── Profile: openrouter — hosted models, OpenAI-compatible API ────────────
# API key ONLY from the OS env var OPENROUTER_API_KEY (public repo!).
#
# BASE-URL INCLUDES /v1 — CHANGED IN SPRING AI 2.0. The OpenAI model was
# rewritten on top of the official OpenAI Java SDK, which appends
# /chat/completions itself; completions-path no longer exists as a property.
# With the stale value the request went to /api/chat/completions and OpenRouter
# answered 404 (com.openai.errors.NotFoundException: 404: Unknown).
#
# Model: OPENROUTER_MODEL env var with a default — one switch for all seven
# agents when OpenRouter latency spikes on the day (see raw-agent yml).
spring:
  config:
    activate:
      on-profile: openrouter
  ai:
    model:
      chat: openai   # activates only the OpenAI chat autoconfiguration
    openai:
      base-url: https://openrouter.ai/api/v1
      api-key: ${OPENROUTER_API_KEY}
      chat:
        options:
          # The .options infix SURVIVED for chat in 2.0 (OpenAiChatProperties
          # still nests an Options object under spring.ai.openai.chat).
          # It was flattened only for embedding, image, audio, moderation
          # and OCR — do not "fix" those by analogy with this block.
          model: ${OPENROUTER_MODEL:openai/gpt-4o-mini}   # vendor prefix required on OpenRouter
          temperature: 0.3
