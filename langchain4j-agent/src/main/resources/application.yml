server:
  port: 8082

spring:
  application:
    name: langchain4j-agent
  data:
    redis:
      host: localhost
      port: 6379

# LangChain4j Ollama (local models)
langchain4j:
  ollama:
    chat-model:
      base-url: http://localhost:11434
      model-name: gemma3:4b
      temperature: 0.3
      timeout: 120s
      log-requests: true
      log-responses: true
  # Uncomment to use OpenAI instead
  # open-ai:
  #   chat-model:
  #     api-key: ${OPENAI_API_KEY}
  #     model-name: gpt-4o-mini
  #     temperature: 0.3
  #     log-requests: true
  #     log-responses: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.xkondix: DEBUG
    dev.langchain4j: INFO
