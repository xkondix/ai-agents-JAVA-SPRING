# Important for stdio: disable banner and logs on stdout
# (stdout is reserved for JSON-RPC MCP)
spring:
  main:
    banner-mode: off
  application:
    name: code-mcp-server
  ai:
    mcp:
      server:
        name: ai-agents-code-server
        version: 1.0.0
        # STDIO = default transport for Claude Desktop
        # Change to SYNC_HTTP_SSE for HTTP transport
        transport: STDIO

logging:
  # For stdio: logs must go to file or stderr, NOT stdout
  pattern:
    console:
  level:
    root: WARN
    com.xkondix: INFO
  file:
    name: logs/code-mcp-server.log

# Project configuration
code-mcp:
  project-root: C:\Users\konra\Desktop\ai-agents-JAVA-SPRING
  allowed-extensions:
    - .java
    - .xml
    - .yml
    - .yaml
    - .properties
    - .md
    - .json
    - .py
    - .jsx
    - .js
    - .ts
    - .tsx
    - .sql
    - .txt
    - .imports   # Spring Boot AutoConfiguration.imports (META-INF/spring)
  ignored-dirs:
    - .git
    - target
    - node_modules
    - .idea
    - .mvn
    - __pycache__
    - logs
  approval-timeout-minutes: 10

# HTTP port (used only when transport=SYNC_HTTP_SSE)
server:
  port: 8086

# ── Observability ─────────────────────────────────────────────────────────
# Note: tracing disabled for stdio transport (stdout reserved for JSON-RPC)
# Enable only when running with SYNC_HTTP_SSE transport
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
